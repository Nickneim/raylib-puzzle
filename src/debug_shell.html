<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Emscripten-Generated Code</title>
    <style>{{{ SHELL_CSS }}}</style>
  </head>
  <body>
    <a href="http://emscripten.org">{{{ SHELL_LOGO }}}</a>

    <div class="spinner" id='spinner'></div>
    <div class="emscripten" id="status">Downloading...</div>

    <span id='controls'>
      <span><input type="checkbox" id="resize">Resize canvas</span>
      <span><input type="checkbox" id="pointerLock" checked>Lock/hide mouse pointer &nbsp;&nbsp;&nbsp;</span>
      <span><input type="button" value="Fullscreen" onclick="goFullscreen()">
      </span>
    </span>

    <div class="emscripten">
      <progress value="0" max="100" id="progress" hidden=1></progress>
    </div>

    <div class="emscripten_border">
      <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex=-1></canvas>
    </div>
    <textarea id="output" rows="8"></textarea>

    <script type='text/javascript'>
      var statusElement = document.getElementById('status');
      var progressElement = document.getElementById('progress');
      var spinnerElement = document.getElementById('spinner');
      var canvasElement = document.getElementById('canvas');
      var outputElement = document.getElementById('output');
      if (outputElement) outputElement.value = ''; // clear browser cache

      // As a default initial behavior, pop up an alert when webgl context is lost. To make your
      // application robust, you may want to override this behavior before shipping!
      // See http://www.khronos.org/registry/webgl/specs/latest/1.0/#5.15.2
      canvasElement.addEventListener('webglcontextlost', (e) => {
        alert('WebGL context lost. You will need to reload the page.');
        e.preventDefault();
      }, false);

      // ---- DPR-aware canvas sizing -------------------------------------
      // Emscripten's built-in requestFullscreen() resize path uses CSS
      // pixels (window.innerWidth/innerHeight or screen.width/height),
      // not physical pixels. On phones with devicePixelRatio > 1 this
      // produces a much lower-resolution canvas than the screen supports.
      // We size the canvas's backing store ourselves and pass
      // resize=false to requestFullscreen so it doesn't fight us.
      function applyCanvasResolution() {
        var dpr = window.devicePixelRatio || 1;
        var cssW = canvasElement.clientWidth  || window.innerWidth;
        var cssH = canvasElement.clientHeight || window.innerHeight;
        var w = Math.round(cssW * dpr);
        var h = Math.round(cssH * dpr);

        canvasElement.width  = w;
        canvasElement.height = h;

        // Let the running app know the framebuffer size changed so it can
        // recompute layouts (raylib will pick this up via
        // GetScreenWidth/GetScreenHeight on the next IsWindowResized()
        // check, since the canvas itself drives those values).
        if (typeof Module !== 'undefined' && Module.setCanvasSize) {
          Module.setCanvasSize(w, h, true);
        }
      }

      function goFullscreen() {
        var lockPointer = document.getElementById('pointerLock').checked;
        var resizeBox   = document.getElementById('resize').checked;

        // Always resize manually with correct DPR; never let Emscripten's
        // CSS-pixel resize path run, since it's what truncates resolution.
        Module.requestFullscreen(lockPointer, false);

        if (resizeBox) {
          // Apply once immediately, then again shortly after, since some
          // browsers report the fullscreen viewport size a frame late.
          applyCanvasResolution();
          setTimeout(applyCanvasResolution, 100);
        }
      }

      document.addEventListener('fullscreenchange', () => {
        if (document.getElementById('resize').checked) {
          applyCanvasResolution();
        }
      });
      // iOS Safari uses the webkit-prefixed event
      document.addEventListener('webkitfullscreenchange', () => {
        if (document.getElementById('resize').checked) {
          applyCanvasResolution();
        }
      });

      window.addEventListener('resize', () => {
        if (document.getElementById('resize').checked) {
          applyCanvasResolution();
        }
      });
      window.addEventListener('orientationchange', () => {
        if (document.getElementById('resize').checked) {
          setTimeout(applyCanvasResolution, 100);
        }
      });
      // ---------------------------------------------------------------

      var setStatus = (text) => {
        if (!setStatus.last) setStatus.last = { time: Date.now(), text: '' };
        if (text === setStatus.last.text) return;
        var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
        var now = Date.now();
        // if this is a progress update, skip it if too soon
        if (m && now - setStatus.last.time < 30) return;
        setStatus.last.time = now;
        setStatus.last.text = text;
        if (m) {
          text = m[1];
          progressElement.value = parseInt(m[2])*100;
          progressElement.max = parseInt(m[4])*100;
          progressElement.hidden = false;
          spinnerElement.hidden = false;
        } else {
          progressElement.value = null;
          progressElement.max = null;
          progressElement.hidden = true;
          if (!text) spinnerElement.style.display = 'none';
        }
        statusElement.innerHTML = text;
      };

#if MODULARIZE && !EXPORT_ES6
      var moduleArgs = {
#else
      var Module = {
#endif
        print(...args) {
          console.log(...args);
          // These replacements are necessary if you render to raw HTML
          //text = text.replace(/&/g, "&amp;");
          //text = text.replace(/</g, "&lt;");
          //text = text.replace(/>/g, "&gt;");
          //text = text.replace('\n', '<br>', 'g');
          if (outputElement) {
            var text = args.join(' ');
            outputElement.value += text + "\n";
            outputElement.scrollTop = outputElement.scrollHeight; // focus on bottom
          }
        },
        canvas: canvasElement,
        setStatus: setStatus,
        totalDependencies: 0,
        monitorRunDependencies(left) {
          this.totalDependencies = Math.max(this.totalDependencies, left);
          setStatus(left ? 'Preparing... (' + (this.totalDependencies-left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
        }
      };
      setStatus('Downloading...');
      window.onerror = window.onunhandledrejection = () => {
        // TODO: do not warn on ok events like simulating an infinite loop or exitStatus
        setStatus('Exception thrown, see JavaScript console');
        spinnerElement.style.display = 'none';
        setStatus = (text) => {
          if (text) console.error('[post-exception status] ' + text);
        };
      };
    </script>
    {{{ SCRIPT }}}
#if MODULARIZE && !EXPORT_ES6
    <script type='text/javascript'>
      {{{ EXPORT_NAME }}}(moduleArgs);
    </script>
#endif
  </body>
</html>
